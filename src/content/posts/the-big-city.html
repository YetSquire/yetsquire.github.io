<div class="doc-export"><p class="c9 title" id="h.bjucoqnl1emo"><span class="c3">The Big City</span></p><p class="c7 subtitle" id="h.9rn6bppeqmqx"><span class="c1">01/09/2024&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span></p><p class="c8"><span class="c6"></span></p><p class="c11"><span class="c6">Nobody alive has seen The Big City, a lost film from 1928. All known copies have faded, burned, or vanished. 100 years later, I was on the team to recreate it in a new medium, and remade an old dream with virtual cinematography and the latest in motion-capture. </span></p><p class="c8"><span class="c6"></span></p><p class="c5"><span class="c4"></span></p><p class="c5"><span class="c4"></span></p></div>
